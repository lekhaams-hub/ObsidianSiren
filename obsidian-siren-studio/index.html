<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian Siren Studio — Where stories find their shine</title>
    
    <!-- Meta tags for SEO -->
    <meta name="description" content="A dual-mode studio for fiction writers and academic scholars. Plan, draft, format, and publish your book.">
    <meta property="og:title" content="Obsidian Siren Studio">
    <meta property="og:description" content="The only friend you need to write and publish a book. Plan, format, design covers, and find expert services.">
    <meta property="og:type" content="website">
    
    <!-- Premium Typography from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700;800&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Core Style Files -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    
    <link rel="icon" type="image/png" href="assets/logo-mark.png" onerror="this.style.display='none'">
</head>
<body>
    <!-- Premium Film-Grain Layer -->
    <div class="film-grain" id="grain-layer" aria-hidden="true"></div>
    
    <!-- Background Radial Gradients -->
    <div class="bg-gradient-glow" aria-hidden="true"></div>

    <!-- Main Application Shell -->
    <div id="app-container" class="app-container">
        <!-- Sidebar Navigation Drawer (injected dynamically via js/sidebar.js) -->
        <aside id="app-sidebar" class="app-sidebar hidden"></aside>
        
        <!-- Main Content Area -->
        <main id="app-main" class="app-main">
            <!-- Dynamic Page Content (injected dynamically via js/app.js router) -->
            <div id="app-content" class="app-content"></div>
        </main>
    </div>

    <!-- Interactive Custom Dialog Box Container -->
    <div id="dialog-root" class="dialog-overlay hidden" role="dialog" aria-modal="true">
        <div class="dialog-content">
            <button class="dialog-close" id="dialog-close-btn" aria-label="Close dialog">&times;</button>
            <div id="dialog-body"></div>
        </div>
    </div>

    <!-- Notification Toast Element -->
    <div id="toast" class="toast hidden" aria-live="polite"></div>

    <!-- Application Initialization Entry Point -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
